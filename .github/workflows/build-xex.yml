
name: Build 360Browser XEX

on:
  workflow_dispatch:
  push:
    branches: [main, master]
    paths:
      - 'xbox360/**'
      - '**/CMakeLists.txt'
      - '.github/workflows/build-xex.yml'

permissions:
  contents: read

jobs:
  build:
    name: Compile 360Browser
    runs-on: ubuntu-24.04
    timeout-minutes: 90

    steps:
      - name: Download source
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential bison flex texinfo \
            libgmp-dev libmpfr-dev libmpc-dev \
            curl xz-utils patch python3 \
            cmake ninja-build git

      - name: Download XSDK
        run: git clone --depth 1 https://github.com/xenosworks/xsdk.git "$HOME/xsdk"

      - name: Build Xbox 360 toolchain
        run: |
          cd "$HOME/xsdk"
          PREFIX="$HOME/xsdk-gcc" \
          WORK="$HOME/xsdk-gcc-work" \
          JOBS="$(nproc)" \
          bash tools/toolchain/build.sh

      - name: Build XSDK libraries
        run: |
          cd "$HOME/xsdk"
          make -j"$(nproc)"

      - name: Compile 360Browser
        run: |
          cmake -S xbox360 -B build -G Ninja \
            -DCMAKE_TOOLCHAIN_FILE="$HOME/xsdk/cmake/xsdk.cmake" \
            -DXSDK_TOOLCHAIN="$HOME/xsdk-gcc" \
            -DCMAKE_BUILD_TYPE=Release

          cmake --build build --parallel

          test -s build/360Browser.xex

      - name: Upload XEX
        uses: actions/upload-artifact@v4
        with:
          name: 360Browser-XEX
          path: build/360Browser.xex
          if-no-files-found: error
          retention-days: 14
